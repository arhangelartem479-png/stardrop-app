<!DOCTYPE html>
<html>
<head>
    <title>StarDrop PRO</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<div class="container">

    <h1>⭐ StarDrop PRO</h1>

    <div class="balance">
        Balance: <span id="balance">...</span> 💰
    </div>

    <div class="case">
        <img id="dropImg" src="https://cdn-icons-png.flaticon.com/512/1077/1077035.png">
        <div class="buttons">
            <button onclick="openCase()">OPEN (100)</button>
            <button class="demo" onclick="demoCase()">DEMO</button>
        </div>
    </div>

    <h2>Your Inventory</h2>
    <div id="inventory" class="inventory"></div>

</div>

<script src="/static/script.js"></script>
</body>
</html>
